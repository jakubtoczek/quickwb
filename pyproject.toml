[project]
name = "quickwb"
dynamic = ["version"]
description = "QuickWB — drag-and-drop image white balance with export and clipboard copy"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.6",
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.scripts]
quickwb = "quickwb.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quickwb"]

[tool.hatch.version]
path = "src/quickwb/__init__.py"
